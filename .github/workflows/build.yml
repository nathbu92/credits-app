name: Build Crédits Admin

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npx electron-builder --win nsis --win portable --x64
          - os: macos-latest
            build_cmd: npx electron-builder --mac dmg zip --x64 --arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Nettoyer les assets manquants dans la config build
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            const exists = (f) => f && fs.existsSync(f);

            if (pkg.build) {
              if (pkg.build.mac && !exists(pkg.build.mac.icon)) {
                console.log('⚠️ icon.icns absent : suppression de mac.icon');
                delete pkg.build.mac.icon;
              }
              if (pkg.build.win && !exists(pkg.build.win.icon)) {
                console.log('⚠️ icon.ico absent : suppression de win.icon');
                delete pkg.build.win.icon;
              }
              if (pkg.build.nsis) {
                if (!exists(pkg.build.nsis.installerIcon)) {
                  console.log('⚠️ installerIcon absent : suppression');
                  delete pkg.build.nsis.installerIcon;
                }
                if (!exists(pkg.build.nsis.uninstallerIcon)) {
                  console.log('⚠️ uninstallerIcon absent : suppression');
                  delete pkg.build.nsis.uninstallerIcon;
                }
                if (!exists(pkg.build.nsis.installerSidebar)) {
                  console.log('⚠️ installerSidebar (bmp) absent : suppression');
                  delete pkg.build.nsis.installerSidebar;
                }
                if (!exists(pkg.build.nsis.installerHeader)) {
                  console.log('⚠️ installerHeader (bmp) absent : suppression');
                  delete pkg.build.nsis.installerHeader;
                }
                if (!exists(pkg.build.nsis.license)) {
                  console.log('⚠️ license absent : suppression');
                  delete pkg.build.nsis.license;
                }
              }
            }
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
          "

      - name: Build (${{ matrix.os }})
        run: ${{ matrix.build_cmd }} --publish never
        env:
          # Empêche electron-builder de tenter une signature/notarisation Apple
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Lister le contenu de dist/
        shell: bash
        run: ls -la dist || true

      - name: Upload des artefacts
        uses: actions/upload-artifact@v4
        with:
          name: credits-admin-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  release:
    name: Créer une Release (si tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
